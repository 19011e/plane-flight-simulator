<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sky Runner</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="hud">
      <div class="hud-title">Sky Runner</div>
      <div>Speed: <span id="speed">0</span> kt</div>
      <div>Altitude: <span id="altitude">0</span> m</div>
      <div>Pitch: <span id="pitch">0</span>°</div>
      <div>Roll: <span id="roll">0</span>°</div>
    </div>

    <div id="help">
      Controls: W/S throttle, A/D yaw, Arrow keys pitch/roll, Space = brake
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
